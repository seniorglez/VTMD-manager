[package]
name = "vtm-campaign-manager"
version = "0.1.0"
description = "VtM Campaign Manager"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vtm_campaign_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
